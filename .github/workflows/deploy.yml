# Push to main deploys. The tests are the gate, because the person pushing has
# looked at the screen they changed and cannot be expected to know what else
# they touched — that is exactly what the suite is for.
name: Deploy

on:
  push:
    branches: [main]
  # Rollback path: run this by hand with an older commit SHA.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or ref to deploy (default: origin/main)'
        required: false
        default: ''

concurrency:
  # Two deploys at once would fight over the same checkout on the server.
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Open an SSH session to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh -o BatchMode=yes "${{ secrets.DEPLOY_HOST }}" \
            "apps/voku/deploy/deploy.sh ${{ inputs.ref || 'origin/main' }}"
